<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Пост — Яндекс Доставка</title>
    <link rel="stylesheet" href="posts.css" />
    <style>
      .kicker {
        margin-top: 50px;
        padding: 0 10px;
        background: linear-gradient(transparent 58%, var(--yandex) 58%, var(--yandex) 92%, transparent 92%);
        font-size: 54px;
        line-height: 1.15;
        white-space: nowrap;
      }

      .h1 {
        margin-top: 16px;
        font-size: 118px;
      }

      /* Hero: the four bags fanned over a Yandex-yellow disc, delivery chip on top. */
      .hero {
        position: relative;
        flex: 1 1 auto;
        width: 100%;
        margin-top: 12px;
      }

      .disc {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 510px;
        height: 510px;
        margin: -266px 0 0 -255px;
        border-radius: 50%;
        background: var(--yandex);
      }

      .fan .bag {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 214px;
        height: 289px;
        margin: -200px 0 0 -107px;
        transform-origin: 50% 100%;
      }

      .chip {
        position: absolute;
        left: 50%;
        bottom: 34px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 20px 46px 22px 36px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--yandex);
        font-size: 52px;
        line-height: 1.15;
        white-space: nowrap;
        transform: translateX(-50%) rotate(-2deg);
        box-shadow: 0 16px 34px rgba(34, 28, 23, 0.22);
      }

      .chip svg {
        display: block;
        width: 112px;
        height: 52px;
      }

      .note {
        margin-top: 8px;
        color: var(--muted);
        font-weight: 600;
        font-size: 38px;
        line-height: 1.3;
        text-align: center;
      }

      .cta {
        margin-top: 34px;
      }
    </style>
  </head>
  <body>
    <main class="post">
      <span class="tag">ДОСТАВКА</span>
      <p class="kicker">Мешок тяжёлый?</p>
      <h1 class="h1">Привезём<br /><span class="accent">до двери</span></h1>

      <div class="hero">
        <div class="disc"></div>
        <div class="fan" id="fan"></div>
        <div class="chip">
          <svg viewBox="0 0 112 52" aria-hidden="true">
            <g stroke="#ffd60a" stroke-width="5" stroke-linecap="round">
              <line x1="4" y1="14" x2="26" y2="14" />
              <line x1="0" y1="26" x2="30" y2="26" />
              <line x1="8" y1="38" x2="28" y2="38" />
            </g>
            <rect x="38" y="6" width="42" height="32" rx="5" fill="#ffd60a" />
            <path d="M82 16 H98 L108 28 V38 H82 Z" fill="#ffd60a" />
            <path d="M87 20 H96 L102 28 H87 Z" fill="#221c17" />
            <circle cx="52" cy="42" r="8" fill="#ffd60a" stroke="#221c17" stroke-width="4" />
            <circle cx="94" cy="42" r="8" fill="#ffd60a" stroke="#221c17" stroke-width="4" />
          </svg>
          <span>ЯНДЕКС ДОСТАВКА</span>
        </div>
      </div>

      <p class="note">Курьер принесёт корм прямо к вашей двери</p>

      <div class="cta">
        <span>ССЫЛКА В ПРОФИЛЕ</span>
        <svg viewBox="0 0 46 46" aria-hidden="true">
          <path d="M23 40 V8 M10 20 L23 7 L36 20" stroke="#fffdf8" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </main>

    <script src="../videos/dog-bags-parade/assets/bag.js"></script>
    <script>
      // Fan the four bags left to right, each one a step further round and on top.
      var fan = document.getElementById("fan");
      window.HFBags.brands.forEach(function (brand, i) {
        var step = i - 1.5;
        var bag = document.createElement("div");
        bag.className = "bag";
        bag.style.zIndex = String(i + 1);
        bag.style.transform =
          "translate(" + step * 176 + "px, " + Math.abs(step) * 22 + "px) rotate(" + step * 9 + "deg)";
        bag.innerHTML = window.HFBags.svg(brand, "fan-" + i);
        fan.appendChild(bag);
      });
    </script>
  </body>
</html>

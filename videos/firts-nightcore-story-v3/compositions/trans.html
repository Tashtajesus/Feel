<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .tr-streak { position: absolute; left: -200px; width: 1480px; top: 897px; height: 6px; border-radius: 3px; opacity: 0;
          background: linear-gradient(90deg, rgba(77, 243, 255, 0) 0%, #4DF3FF 25%, #FFF3FB 50%, #FF4FB4 75%, rgba(255, 79, 180, 0) 100%);
          box-shadow: 0 0 24px 6px rgba(255, 243, 251, 0.6), 0 0 80px 20px rgba(255, 79, 180, 0.35); }
        .tr-bloom { position: absolute; left: -300px; width: 1680px; top: 700px; height: 400px; opacity: 0; mix-blend-mode: screen;
          background: radial-gradient(50% 50% at 50% 50%, rgba(255, 220, 245, 0.75) 0%, rgba(255, 79, 180, 0.25) 40%, rgba(255, 79, 180, 0) 70%); }
        .tr-iris { position: absolute; left: 340px; top: 700px; width: 400px; height: 400px; border-radius: 50%; opacity: 0;
          border: 5px solid #FFF3FB; box-shadow: 0 0 30px #FF4FB4, inset 0 0 30px #4DF3FF; }
        .tr-leak { position: absolute; left: 0; top: 300px; width: 1300px; height: 1300px; border-radius: 50%; opacity: 0; mix-blend-mode: screen;
          background: radial-gradient(50% 50% at 50% 50%, rgba(255, 140, 210, 0.55) 0%, rgba(255, 79, 180, 0.22) 35%, rgba(77, 243, 255, 0.10) 60%, rgba(77, 243, 255, 0) 72%); }
      </style>
      <div id="root" data-composition-id="trans" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          var root = document.querySelector('[data-composition-id="trans"]');
          function mk(cls) { var d = document.createElement("div"); d.className = cls; d.setAttribute("data-layout-ignore", ""); root.appendChild(d); return d; }
          var tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });

          // scene seams: anamorphic streak + bloom + iris ring
          [6.827, 18.065, 42.051, 66.595, 78.065].forEach(function (t, i) {
            var s = mk("tr-streak"), b = mk("tr-bloom"), r = mk("tr-iris");
            tl.fromTo(s, { opacity: 1, scaleX: 0.05 }, { scaleX: 1.2, duration: 0.28, ease: "expo.out" }, t - 0.08);
            tl.to(s, { opacity: 0, scaleY: 0.3, duration: 0.4, ease: "power2.in" }, t + 0.2);
            tl.fromTo(b, { opacity: 0.9, scaleY: 0.4 }, { opacity: 0, scaleY: 1.4, duration: 0.7, ease: "power2.out" }, t - 0.04);
            tl.fromTo(r, { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 3.2, duration: 0.75, ease: "expo.out" }, t);
          });

          // light leaks sweep across on the big surges
          [[7.546, -700, 500], [43.561, 600, -600], [67.57, -600, 400], [19.574, 500, -500], [31.579, -500, 300]].forEach(function (e) {
            var l = mk("tr-leak");
            tl.fromTo(l, { x: e[1], y: -200, scale: 0.8 }, { x: e[2], y: 200, scale: 1.2, duration: 1.6, ease: "sine.inOut" }, e[0]);
            tl.fromTo(l, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, e[0]);
            tl.to(l, { opacity: 0, duration: 0.9, ease: "power2.in" }, e[0] + 0.7);
          });

          window.__timelines["trans"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>

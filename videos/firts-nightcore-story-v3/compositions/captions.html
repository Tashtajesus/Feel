<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-cyrillic-900-normal.woff2") format("woff2"); font-weight: 900; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .cap { position: absolute; left: 50px; right: 50px; top: 1130px; height: 330px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; column-gap: 40px; row-gap: 0; opacity: 0; }
        .cw { position: relative; display: block; font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 104px; line-height: 128px; letter-spacing: -0.03em; white-space: nowrap;
          -webkit-text-stroke: 14px #12051F; paint-order: stroke fill; opacity: 0; }
        .cw.k { font-size: 128px; line-height: 150px; }
        .c0 { color: #FF4FB4; text-shadow: 0 9px 0 #12051F, 0 0 34px rgba(255, 79, 180, 0.85); }
        .c1 { color: #4DF3FF; text-shadow: 0 9px 0 #12051F, 0 0 34px rgba(77, 243, 255, 0.85); }
        .c2 { color: #FFE45C; text-shadow: 0 9px 0 #12051F, 0 0 34px rgba(255, 228, 92, 0.8); }
        .c3 { color: #FFF3FB; text-shadow: 0 9px 0 #12051F, 0 0 34px rgba(185, 163, 255, 0.9); }
      </style>
      <div id="root" data-composition-id="captions" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          var root = document.querySelector('[data-composition-id="captions"]');
          var KEY = { "ВЫСОКО": 1, "ЛЕТАЮ": 1, "ТАЮ": 1, "РАКЕТУ": 1, "СУКА": 1, "ЛЕГКО": 1, "ХОРОШО": 1, "НАВСЕГДА": 1, "МЕШАЮ": 1, "ТАБЛЕТКИ": 1, "НАПЛЕВАТЬ": 1 };
          var tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
          var ci = 0;
          window.NC_LYRICS.forEach(function (c, n) {
            var box = document.createElement("div");
            box.className = "cap";
            root.appendChild(box);
            tl.set(box, { opacity: 1 }, c.t);
            tl.set(box, { opacity: 0 }, c.end);
            c.w.forEach(function (w, j) {
              var el = document.createElement("div");
              var key = KEY[w[0]] && w[0].length < 10;
              el.className = "cw c" + (ci++ % 4) + (key ? " k" : "");
              el.textContent = w[0];
              box.appendChild(el);
              var rot = ((n * 7 + j * 5) % 9) - 4;
              tl.fromTo(el, { opacity: 1, scale: 0.35, rotation: rot * 3, y: 40 }, { scale: 1, rotation: rot, y: 0, duration: 0.32, ease: "back.out(2.6)" }, w[1]);
              if (key) tl.fromTo(el, { x: -8 }, { x: 0, duration: 0.25, ease: "elastic.out(1, 0.3)" }, w[1] + 0.12);
            });
          });
          window.__timelines["captions"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>

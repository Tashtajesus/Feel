<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f3-lines { position: absolute; left: -420px; top: -120px; width: 1920px; height: 2040px; opacity: 0.3; }
        #f3-window { position: absolute; left: 0; right: 0; top: 690px; height: 420px; overflow: hidden; }
        .f3-word { position: absolute; left: 0; right: 0; top: 0; height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
        .f3-word div { position: relative; font-family: "Unbounded", sans-serif; font-weight: 900; letter-spacing: -0.04em; color: #FFF3FB; text-shadow: 0 0 24px rgba(255, 79, 180, 0.9), 0 0 70px rgba(255, 79, 180, 0.45); line-height: 1; }
        .f3-big div { font-size: 240px; }
        .f3-two div { font-size: 170px; line-height: 180px; }
        .f3-outline div { color: rgba(185, 163, 255, 0.22); -webkit-text-stroke: 4px #B9A3FF; text-shadow: 0 0 30px rgba(185, 163, 255, 0.7); }
        .f3-cyan div { text-shadow: 0 0 24px rgba(77, 243, 255, 0.95), 0 0 70px rgba(77, 243, 255, 0.45); }
      </style>
      <div id="root" data-composition-id="03-f3" data-width="1080" data-height="1920">
        <svg id="f3-lines" viewBox="-960 -1020 1920 2040"><g id="f3-rays"></g></svg>
        <div id="f3-window"></div>
      </div>
      <script>
        (function () {
          var T0 = 18.065, DUR = 23.986;
          var WORDS = [
            [18.065, ["tashta"], "f3-big"],
            [19.574, ["x"], "f3-big f3-cyan"],
            [22.57, ["sickboy", "rostik"], "f3-two"],
            [25.588, ["firts"], "f3-big"],
            [28.561, ["night"], "f3-big f3-cyan"],
            [31.579, ["core"], "f3-big f3-outline"],
            [34.551, ["tashta"], "f3-big"],
            [37.547, ["sickboy", "rostik"], "f3-two f3-cyan"],
            [40.565, ["firts"], "f3-big"]
          ];
          var SNARES = [19.458, 19.853, 21.037, 22.5, 22.848, 24.752, 24.915, 26.239, 30.023, 34.853, 35.225, 35.991, 36.757, 38.22, 39.776, 40.519, 40.728, 40.89, 41.239, 41.842, 41.982];
          var NS = "http://www.w3.org/2000/svg";
          var rays = document.getElementById("f3-rays");
          var RC = ["#FF4FB4", "#4DF3FF", "#FFF3FB"];
          for (var i = 0; i < 64; i++) {
            var a = (i / 64) * Math.PI * 2, w = 0.012 + (i % 4) * 0.006, r0 = 260 + (i % 5) * 40;
            var p = document.createElementNS(NS, "path");
            var x1 = Math.cos(a - w) * 1500, y1 = Math.sin(a - w) * 1500, x2 = Math.cos(a + w) * 1500, y2 = Math.sin(a + w) * 1500;
            p.setAttribute("d", "M" + (Math.cos(a) * r0).toFixed(1) + "," + (Math.sin(a) * r0).toFixed(1) + " L" + x1.toFixed(1) + "," + y1.toFixed(1) + " L" + x2.toFixed(1) + "," + y2.toFixed(1) + " Z");
            p.setAttribute("fill", RC[i % 3]);
            p.setAttribute("class", "f3-ray");
            rays.appendChild(p);
          }
          var win = document.getElementById("f3-window");
          var els = WORDS.map(function (w, i) {
            var el = document.createElement("div");
            el.className = "f3-word " + w[2];
            w[1].forEach(function (line) { var d = document.createElement("div"); d.textContent = line; el.appendChild(d); });
            win.appendChild(el);
            return el;
          });

          var tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
          tl.fromTo("#f3-lines", { rotation: 0 }, { rotation: 24, duration: DUR, ease: "none" }, 0);

          // slot-machine word swaps on every downbeat
          els.forEach(function (el, i) {
            var t = WORDS[i][0] - T0;
            if (i === 0) tl.fromTo(el, { opacity: 1, yPercent: 0, scale: 1.25 }, { scale: 1, duration: 0.3, ease: "expo.out" }, 0);
            else tl.fromTo(el, { opacity: 1, yPercent: 105 }, { yPercent: 0, duration: 0.3, ease: "back.out(1.6)" }, t);
            if (i < els.length - 1) tl.to(el, { yPercent: -105, duration: 0.24, ease: "power3.in" }, WORDS[i + 1][0] - T0 - 0.06);
            // speed-line slam on each change
            tl.fromTo("#f3-lines", { opacity: 0.95, scale: 1.18 }, { opacity: 0.28, scale: 1, duration: 1.3, ease: "power2.out" }, t);
          });

          // lilac dream dip in the breath, 31.6 → 34.5
          tl.to(".f3-ray", { fill: "#B9A3FF", duration: 0.4 }, 31.579 - T0);
          tl.to("#f3-lines", { opacity: 0.12, duration: 0.6 }, 31.579 - T0 + 0.9);
          tl.to(".f3-ray", { fill: function (i) { return RC[i % 3]; }, duration: 0.15 }, 34.551 - T0 - 0.05);

          // snare jitter on the active word (the window, so slot moves stay clean)
          SNARES.forEach(function (s, i) {
            var t = s - T0, dx = (i % 2 ? 1 : -1) * (10 + (i % 3) * 6);
            tl.fromTo("#f3-window", { x: dx, skewX: dx * 0.4 }, { x: 0, skewX: 0, duration: 0.18, ease: "power2.out" }, t);
          });

          window.__timelines["03-f3"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>

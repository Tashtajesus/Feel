        [data-composition-id="world"] [data-hf-authored-id="root"] { position: absolute; inset: 0; overflow: hidden; background: #0B0617; }
        [data-composition-id="world"] #world-sky {
          position: absolute; inset: 0;
          background:
            radial-gradient(120% 60% at 50% 0%, #2A0F4A 0%, rgba(42, 15, 74, 0) 70%),
            radial-gradient(90% 45% at 50% 100%, rgba(77, 243, 255, 0.10) 0%, rgba(77, 243, 255, 0) 70%),
            linear-gradient(180deg, #160A2C 0%, #0B0617 55%, #0D0820 100%);
        }
        [data-composition-id="world"] #world-stars, [data-composition-id="world"] #world-ring { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        [data-composition-id="world"] #world-vig { position: absolute; inset: 0; background: radial-gradient(75% 55% at 50% 47%, rgba(11, 6, 23, 0) 55%, rgba(11, 6, 23, 0.78) 100%); }
        [data-composition-id="world"] #world-head {
          position: absolute; left: 0; right: 0; top: 290px; text-align: center;
          font-family: "Space Mono", monospace; font-weight: 700; font-size: 26px;
          letter-spacing: 0.32em; color: #FFF3FB; opacity: 0;
          text-shadow: 0 0 18px rgba(255, 79, 180, 0.7);
        }
        [data-composition-id="world"] #world-player { position: absolute; left: 110px; right: 110px; top: 1490px; height: 60px; opacity: 0; }
        [data-composition-id="world"] #world-track { position: absolute; left: 0; right: 0; top: 0; height: 6px; border-radius: 3px; background: rgba(185, 163, 255, 0.22); }
        [data-composition-id="world"] #world-fill { position: absolute; left: 0; top: 0; height: 6px; width: 0; border-radius: 3px; background: linear-gradient(90deg, #4DF3FF, #FF4FB4); box-shadow: 0 0 14px rgba(255, 79, 180, 0.8); }
        [data-composition-id="world"] #world-knob { position: absolute; top: -7px; left: -10px; width: 20px; height: 20px; border-radius: 50%; background: #FFF3FB; box-shadow: 0 0 16px #FF4FB4, 0 0 4px #fff; }
        [data-composition-id="world"] .world-time { position: absolute; top: 22px; font-family: "Space Mono", monospace; font-weight: 400; font-size: 24px; color: rgba(255, 243, 251, 0.75); letter-spacing: 0.08em; }
        [data-composition-id="world"] #world-tnow { left: 0; }

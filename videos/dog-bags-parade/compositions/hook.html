<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Hook — Мешки для собак</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Unbounded";
          src: url("assets/fonts/unbounded-cyrillic-800-normal.woff2") format("woff2");
          font-weight: 800;
          unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
        }
        @font-face {
          font-family: "Unbounded";
          src: url("assets/fonts/unbounded-latin-800-normal.woff2") format("woff2");
          font-weight: 800;
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: "Rubik";
          src: url("assets/fonts/rubik-cyrillic-700-normal.woff2") format("woff2");
          font-weight: 700;
          unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
        }

        #hook-root {
          --ink: #221c17;
          --orange: #d9480f;
          --green: #0f7f51;
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--ink);
        }

        #hook-root #hook-scene {
          position: absolute;
          inset: 0;
        }

        #hook-root .hook-lift,
        #hook-root .hook-shake {
          display: block;
          width: 100%;
          height: 100%;
        }

        #hook-root .hook-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          width: 100%;
          height: 100%;
          padding: 240px 80px 380px;
          box-sizing: border-box;
        }

        #hook-root .hook-word {
          display: block;
          font-family: "Unbounded", sans-serif;
          font-weight: 800;
          white-space: nowrap;
          line-height: 1;
          transform-origin: 50% 100%;
        }

        #hook-root .hook-word-1 {
          font-size: 178px;
          letter-spacing: -0.02em;
        }

        #hook-root .hook-word-2 {
          font-size: 92px;
          color: var(--orange);
        }

        #hook-root .hook-stamp {
          display: block;
          margin-top: 48px;
          padding: 10px 36px 14px;
          border: 9px solid var(--green);
          border-radius: 22px;
          color: var(--green);
          font-family: "Rubik", sans-serif;
          font-weight: 700;
          font-size: 76px;
          line-height: 1.1;
          letter-spacing: 0.04em;
          white-space: nowrap;
        }
      </style>

      <div
        id="hook-root"
        data-composition-id="hook"
        data-start="0"
        data-duration="1.5"
        data-fps="30"
        data-width="1080"
        data-height="1920"
      >
        <div id="hook-scene" class="clip" data-start="0" data-duration="1.5" data-track-index="0">
          <div class="hook-lift" id="hook-lift">
            <div class="hook-shake" id="hook-shake">
              <div class="hook-content">
                <span class="hook-word hook-word-1" id="hook-word-1" data-layout-allow-overflow="true">Мешки</span>
                <span class="hook-word hook-word-2" id="hook-word-2">для собак</span>
                <span class="hook-stamp" id="hook-stamp" data-layout-allow-overflow="true">В НАЛИЧИИ</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        (function () {
          var FRAME = 1 / 30;
          var tl = gsap.timeline({ paused: true });

          function shake(at, amp) {
            tl.to("#hook-shake", { x: amp, y: -amp * 0.6, duration: FRAME, ease: "power2.out" }, at);
            tl.to("#hook-shake", { x: -amp * 0.7, y: amp * 0.4, duration: FRAME, ease: "power2.out" }, at + FRAME);
            tl.to("#hook-shake", { x: 0, y: 0, duration: FRAME, ease: "power2.out" }, at + 2 * FRAME);
          }

          // "МЕШКИ" falls into the frame and hits on the 0.5s beat.
          tl.fromTo(
            "#hook-word-1",
            { scale: 2.3, autoAlpha: 0 },
            { scale: 1, autoAlpha: 1, duration: 0.5, ease: "power3.in" },
            0,
          );
          tl.to("#hook-word-1", { scaleY: 0.86, scaleX: 1.06, duration: 0.06, ease: "power2.out" }, 0.5);
          tl.to("#hook-word-1", { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(3)" }, 0.56);
          shake(0.5, 14);

          // "ДЛЯ СОБАК" rises in on the off-beat.
          tl.fromTo(
            "#hook-word-2",
            { y: 90, autoAlpha: 0 },
            { y: 0, autoAlpha: 1, duration: 0.25, ease: "power4.out" },
            0.55,
          );

          // Rubber stamp slams down on the 1.0s beat.
          tl.fromTo(
            "#hook-stamp",
            { scale: 2.6, rotation: -22, autoAlpha: 0 },
            { scale: 1, rotation: -7, autoAlpha: 1, duration: 0.25, ease: "power3.in" },
            0.75,
          );
          shake(1.0, 10);

          // Whip the whole hook up and out to cut on the 1.5s beat.
          tl.fromTo("#hook-lift", { y: 0 }, { y: -1500, duration: 0.22, ease: "power4.in" }, 1.28);

          window.__timelines["hook"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>

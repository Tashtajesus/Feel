<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Finale — Мешки для собак</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Unbounded";
          src: url("assets/fonts/unbounded-cyrillic-800-normal.woff2") format("woff2");
          font-weight: 800;
          unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
        }
        @font-face {
          font-family: "Rubik";
          src: url("assets/fonts/rubik-cyrillic-700-normal.woff2") format("woff2");
          font-weight: 700;
          unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
        }
        @font-face {
          font-family: "Rubik";
          src: url("assets/fonts/rubik-latin-700-normal.woff2") format("woff2");
          font-weight: 700;
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: "Oswald";
          src: url("assets/fonts/oswald-cyrillic-700-normal.woff2") format("woff2");
          font-weight: 700;
          unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
        }

        #finale-root {
          --ink: #221c17;
          --paper: #fffdf8;
          --orange: #d9480f;
          --yandex: #ffd60a;
          --kaspi: #de3a2b;
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--ink);
          font-family: "Rubik", sans-serif;
          font-weight: 700;
        }

        #finale-root #finale-scene {
          position: absolute;
          inset: 0;
        }

        #finale-root .f-breath,
        #finale-root .f-shake {
          display: block;
          width: 100%;
          height: 100%;
        }

        #finale-root .f-layout {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 30px;
          width: 100%;
          height: 100%;
          padding: 200px 70px 360px;
          box-sizing: border-box;
        }

        #finale-root .f-title {
          display: block;
          margin-bottom: 30px;
          font-family: "Unbounded", sans-serif;
          font-weight: 800;
          font-size: 74px;
          line-height: 1.1;
          white-space: nowrap;
        }

        #finale-root .f-title-accent {
          color: var(--orange);
        }

        #finale-root .f-row {
          display: flex;
          justify-content: center;
          gap: 22px;
          margin-bottom: 48px;
        }

        #finale-root .f-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
        }

        #finale-root .f-bob,
        #finale-root .f-bag {
          display: block;
          width: 210px;
          height: 284px;
        }

        #finale-root .f-bag svg {
          display: block;
          width: 100%;
          height: 100%;
          overflow: visible;
          filter: drop-shadow(0 14px 14px rgba(34, 28, 23, 0.22));
        }

        #finale-root .bag-name {
          font-family: "Oswald", sans-serif;
          font-weight: 700;
        }

        #finale-root .bag-sub {
          font-family: "Rubik", sans-serif;
          font-weight: 700;
          letter-spacing: 2px;
        }

        #finale-root .f-label {
          display: block;
          font-size: 32px;
          white-space: nowrap;
        }

        #finale-root .f-chip {
          display: flex;
          align-items: center;
          gap: 20px;
          padding: 16px 40px;
          border-radius: 999px;
          font-size: 54px;
          line-height: 1.15;
          white-space: nowrap;
          box-shadow: 0 12px 30px rgba(34, 28, 23, 0.14);
        }

        #finale-root .f-yandex {
          background: var(--yandex);
          color: var(--ink);
        }

        #finale-root .f-kaspi {
          background: var(--kaspi);
          color: var(--paper);
        }

        #finale-root .f-chip svg {
          display: block;
          width: 76px;
          height: 52px;
        }

        #finale-root .f-pays {
          display: flex;
          gap: 16px;
          margin-bottom: 52px;
        }

        #finale-root .f-pay {
          display: block;
          padding: 10px 26px;
          border: 4px solid var(--ink);
          border-radius: 999px;
          background: var(--paper);
          font-size: 36px;
          line-height: 1.15;
          white-space: nowrap;
        }

        #finale-root .f-cta {
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 18px 44px;
          border-radius: 26px;
          background: var(--ink);
          color: var(--paper);
          font-size: 54px;
          line-height: 1.15;
          white-space: nowrap;
        }

        #finale-root .f-cta svg {
          display: block;
          width: 46px;
          height: 46px;
        }
      </style>

      <div
        id="finale-root"
        data-composition-id="finale"
        data-start="0"
        data-duration="4"
        data-fps="30"
        data-width="1080"
        data-height="1920"
      >
        <div id="finale-scene" class="clip" data-start="0" data-duration="4" data-track-index="0">
          <div class="f-breath" id="finale-breath">
            <div class="f-shake" id="finale-shake">
              <div class="f-layout">
                <span class="f-title" id="finale-title" data-layout-allow-overflow="true">
                  <span class="f-title-accent">ВСЁ</span> В НАЛИЧИИ
                </span>

                <div class="f-row" id="finale-row"></div>

                <div class="f-chip f-yandex" id="finale-yandex" data-layout-allow-overflow="true">
                  <svg viewBox="0 0 76 52" aria-hidden="true">
                    <rect x="2" y="6" width="42" height="32" rx="5" fill="#221c17" />
                    <path d="M46 16 H62 L72 28 V38 H46 Z" fill="#221c17" />
                    <path d="M51 20 H60 L66 28 H51 Z" fill="#ffd60a" />
                    <circle cx="16" cy="42" r="8" fill="#221c17" stroke="#ffd60a" stroke-width="4" />
                    <circle cx="58" cy="42" r="8" fill="#221c17" stroke="#ffd60a" stroke-width="4" />
                  </svg>
                  <span>ЯНДЕКС ДОСТАВКА</span>
                </div>

                <div class="f-chip f-kaspi" id="finale-kaspi" data-layout-allow-overflow="true">
                  <span>МЫ В KASPI МАГАЗИНЕ</span>
                </div>

                <div class="f-pays">
                  <span class="f-pay" id="finale-pay-0">KASPI GOLD</span>
                  <span class="f-pay" id="finale-pay-1">KASPI RED</span>
                  <span class="f-pay" id="finale-pay-2">РАССРОЧКА</span>
                </div>

                <div class="f-cta" id="finale-cta">
                  <span>ССЫЛКА В ПРОФИЛЕ</span>
                  <svg viewBox="0 0 46 46" aria-hidden="true">
                    <path d="M23 40 V8 M10 20 L23 7 L36 20" stroke="#fffdf8" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script src="assets/bag.js"></script>
      <script>
        (function () {
          var brands = window.HFBags.brands;
          var row = document.getElementById("finale-row");

          brands.forEach(function (brand, i) {
            var item = document.createElement("div");
            item.className = "f-item";
            item.id = "finale-item-" + i;
            item.innerHTML =
              '<div class="f-bob" id="finale-bob-' + i + '">' +
              '<div class="f-bag">' + window.HFBags.svg(brand, "finale-" + i) + "</div></div>" +
              '<span class="f-label">' + brand.name + "</span>";
            row.appendChild(item);
          });

          var FRAME = 1 / 30;
          var tl = gsap.timeline({ paused: true });

          tl.fromTo(
            "#finale-title",
            { scale: 1.5, autoAlpha: 0 },
            { scale: 1, autoAlpha: 1, duration: 0.4, ease: "expo.out" },
            0,
          );

          // Group shot: bags pop in on eighth notes, then bob gently.
          brands.forEach(function (brand, i) {
            var dir = i % 2 === 0 ? -1 : 1;
            tl.fromTo(
              "#finale-item-" + i,
              { scale: 0, y: 60, rotation: dir * 12, autoAlpha: 0 },
              { scale: 1, y: 0, rotation: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2.4)" },
              0.25 * i,
            );
            tl.fromTo(
              "#finale-bob-" + i,
              { y: 0 },
              { y: -10, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false },
              1.0 + 0.12 * i,
            );
          });

          // Delivery and payment chips land on the beat.
          tl.fromTo("#finale-yandex", { x: -1200 }, { x: 0, duration: 0.35, ease: "power4.out" }, 1.5);
          tl.fromTo("#finale-kaspi", { x: 1200 }, { x: 0, duration: 0.35, ease: "power4.out" }, 2.0);
          [0, 1, 2].forEach(function (k) {
            tl.fromTo(
              "#finale-pay-" + k,
              { scale: 0, autoAlpha: 0 },
              { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2.5)" },
              2.25 + 0.25 * k,
            );
          });

          // Call to action on the final hit, then one pulse.
          tl.fromTo(
            "#finale-cta",
            { y: 90, autoAlpha: 0 },
            { y: 0, autoAlpha: 1, duration: 0.3, ease: "power4.out" },
            3.0,
          );
          tl.to("#finale-shake", { x: 10, y: -6, duration: FRAME, ease: "power2.out" }, 3.0);
          tl.to("#finale-shake", { x: -7, y: 4, duration: FRAME, ease: "power2.out" }, 3.0 + FRAME);
          tl.to("#finale-shake", { x: 0, y: 0, duration: FRAME, ease: "power2.out" }, 3.0 + 2 * FRAME);
          tl.to("#finale-cta", { scale: 1.07, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.4);

          tl.fromTo("#finale-breath", { scale: 1 }, { scale: 1.025, duration: 3.6, ease: "sine.inOut" }, 0.4);

          window.__timelines["finale"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>

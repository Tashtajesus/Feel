<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f4-shake { position: absolute; inset: 0; }
        #f4-wall { position: absolute; left: 0; top: -30px; width: 1080px; height: 1980px; opacity: 0; --a: #FF4FB4; --b: #4DF3FF; }
        .f4-wrap { position: relative; height: 180px; width: 1080px; }
        .f4-row { position: absolute; left: -900px; top: 0; white-space: nowrap; font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 150px; line-height: 180px; letter-spacing: -0.04em; }
        .f4-fill .f4-row { color: var(--a); opacity: 0.32; }
        .f4-line .f4-row { color: rgba(0, 0, 0, 0); -webkit-text-stroke: 2px var(--b); opacity: 0.6; }
        #f4-band { position: absolute; left: 0; right: 0; top: 735px; height: 330px; background: linear-gradient(180deg, rgba(11, 6, 23, 0) 0%, rgba(11, 6, 23, 0.82) 22%, rgba(11, 6, 23, 0.82) 78%, rgba(11, 6, 23, 0) 100%); opacity: 0; }
        #f4-title { position: absolute; left: 0; right: 0; top: 780px; height: 240px; }
        #f4-title span { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 230px; line-height: 240px; letter-spacing: -0.04em; }
        #f4-title .m { color: #FFF3FB; text-shadow: 0 0 24px rgba(255, 79, 180, 0.9), 0 0 70px rgba(255, 79, 180, 0.5); }
        #f4-title .gp { color: #FF4FB4; mix-blend-mode: screen; opacity: 0.6; }
        #f4-title .gc { color: #4DF3FF; mix-blend-mode: screen; opacity: 0.6; }
        #f4-title .sh { color: rgba(0, 0, 0, 0); text-shadow: none; background: linear-gradient(105deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0.95) 50%, rgba(255, 220, 245, 0.6) 54%, rgba(255, 255, 255, 0) 64%); background-size: 300% 100%; background-position: 160% 0; -webkit-background-clip: text; background-clip: text; }
      </style>
      <div id="root" data-composition-id="04-f4" data-width="1080" data-height="1920">
        <div id="f4-shake">
          <div data-layout-ignore id="f4-wall"></div>
          <div id="f4-band"></div>
          <div id="f4-title"><span data-layout-ignore class="gp" id="f4-gp">firts</span><span data-layout-ignore class="gc" id="f4-gc">firts</span><span data-layout-allow-occlusion class="m" id="f4-m">firts</span><span data-layout-ignore class="sh" id="f4-sh">firts</span></div>
        </div>
      </div>
      <script>
        (function () {
          var T0 = 42.051, DUR = 24.01;
          var DOWN = [43.561, 46.579, 49.575, 52.57, 55.565, 58.561, 61.556, 64.575];
          var SNARES = [43.839, 44.28, 45.047, 45.79, 46.51, 46.858, 47.253, 50.411, 52.106, 53.29, 54.753, 56.239, 58.491, 59.048, 59.257, 60.0, 60.558, 61.486, 63.576, 63.785, 64.737, 65.248, 65.991];
          var wall = document.getElementById("f4-wall");
          var rows = [], wraps = [];
          for (var i = 0; i < 11; i++) {
            var w = document.createElement("div");
            w.className = "f4-wrap " + (i % 2 ? "f4-line" : "f4-fill");
            var r = document.createElement("div");
            r.className = "f4-row";
            r.textContent = "firts firts firts firts firts firts firts";
            w.appendChild(r); wall.appendChild(w);
            rows.push(r); wraps.push(w);
          }
          var tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
          var S = DOWN[0] - T0;

          // breath: small hollow title
          tl.fromTo("#f4-title", { scale: 0.55, opacity: 0.6 }, { scale: 0.62, opacity: 0.8, duration: S, ease: "sine.inOut" }, 0);
          // surge: wall slams in, title punches
          tl.fromTo("#f4-title", { scale: 1.45, opacity: 1 }, { scale: 1, duration: 0.35, ease: "expo.out", immediateRender: false }, S);
          tl.set(wall, { opacity: 1 }, S);
          tl.to("#f4-band", { opacity: 1, duration: 0.2 }, S);
          wraps.forEach(function (w, i) {
            var dir = i % 2 ? 1 : -1;
            tl.fromTo(w, { x: dir * 1200 }, { x: 0, duration: 0.45, ease: "expo.out" }, S + i * 0.03);
            tl.fromTo(rows[i], { x: 0 }, { x: dir * -620, duration: DUR - S, ease: "none" }, S);
          });

          // palette flips per bar
          DOWN.forEach(function (d, b) {
            var t = d - T0;
            tl.set(wall, { "--a": b % 2 ? "#4DF3FF" : "#FF4FB4", "--b": b % 2 ? "#FF4FB4" : "#4DF3FF" }, t);
            if (b > 0) tl.fromTo("#f4-m", { scale: 1.12 }, { scale: 1, duration: 0.4, ease: "power3.out" }, t);
          });

          // snares: RGB ghost split, row slices, small shake
          SNARES.forEach(function (s, i) {
            var t = s - T0, d = 16 + (i % 3) * 12;
            tl.fromTo("#f4-gp", { x: -d, opacity: 0.95 }, { x: -3, opacity: 0.6, duration: 0.3, ease: "power3.out" }, t);
            tl.fromTo("#f4-gc", { x: d, opacity: 0.95 }, { x: 3, opacity: 0.6, duration: 0.3, ease: "power3.out" }, t);
            tl.fromTo("#f4-shake", { x: (i % 2 ? 9 : -9), y: (i % 3 - 1) * 7 }, { x: 0, y: 0, duration: 0.16, ease: "power2.out" }, t);
            tl.fromTo(wall, { skewX: (i % 2 ? 6 : -6) }, { skewX: 0, duration: 0.14, ease: "power2.out" }, t);
          });

          tl.fromTo("#f4-title", { rotationY: 8, rotationX: -3, transformPerspective: 1000 }, { rotationY: -8, rotationX: 3, duration: DUR, ease: "sine.inOut" }, 0);
          DOWN.forEach(function (d) { tl.fromTo("#f4-sh", { backgroundPosition: "160% 0" }, { backgroundPosition: "-60% 0", duration: 0.9, ease: "power2.inOut" }, d - T0 + 0.05); });
          window.__timelines["04-f4"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>

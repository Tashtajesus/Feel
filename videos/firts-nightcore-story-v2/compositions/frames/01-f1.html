<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
        @font-face { font-family: "Space Mono"; src: url("assets/fonts/space-mono-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f1-chip { opacity: 0;
          position: absolute; top: 300px; left: 50%; margin-left: -190px; width: 380px; height: 64px;
          background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03)); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
          border: 1.5px solid rgba(255, 243, 251, 0.45); border-radius: 32px; box-shadow: 0 0 24px rgba(77, 243, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 -10px 24px rgba(255, 79, 180, 0.12);
          display: flex; align-items: center; justify-content: center; gap: 16px;
          font-family: "Space Mono", monospace; font-weight: 700; font-size: 26px; letter-spacing: 0.2em; color: #FFF3FB;
        }
        #f1-tri { width: 0; height: 0; border-left: 16px solid #FF4FB4; border-top: 10px solid transparent; border-bottom: 10px solid transparent; filter: drop-shadow(0 0 6px #FF4FB4); }
        #f1-chiptxt { display: flex; }
        #f1-chiptxt span { display: inline-block; white-space: pre; opacity: 0; }
        #f1-title { position: absolute; left: 0; right: 0; top: 780px; height: 240px; }
        #f1-title span { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 210px; line-height: 240px; letter-spacing: -0.04em; }
        #f1-title .m { color: #FFF3FB; text-shadow: 0 0 24px rgba(255, 79, 180, 0.85), 0 0 64px rgba(255, 79, 180, 0.45); }
        #f1-title .gp { color: #FF4FB4; mix-blend-mode: screen; opacity: 0; }
        #f1-title .gc { color: #4DF3FF; mix-blend-mode: screen; opacity: 0; }
        #f1-title .sh { color: rgba(0, 0, 0, 0); text-shadow: none; background: linear-gradient(105deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0.95) 50%, rgba(255, 220, 245, 0.6) 54%, rgba(255, 255, 255, 0) 64%); background-size: 300% 100%; background-position: 160% 0; -webkit-background-clip: text; background-clip: text; }
        #f1-artist { position: absolute; left: 0; right: 0; top: 1050px; display: flex; justify-content: center; font-family: "Space Mono", monospace; font-weight: 700; font-size: 34px; letter-spacing: 0.16em; color: #FFF3FB; text-shadow: 0 0 14px rgba(77, 243, 255, 0.8); }
        #f1-artist span { display: inline-block; white-space: pre; opacity: 0; }
      </style>
      <div id="root" data-composition-id="01-f1" data-width="1080" data-height="1920">
        <div id="f1-chip"><div id="f1-tri"></div><div id="f1-chiptxt"></div></div>
        <div id="f1-title"><span data-layout-ignore class="gp" id="f1-gp">firts</span><span data-layout-ignore class="gc" id="f1-gc">firts</span><span data-layout-allow-occlusion class="m" id="f1-m">firts</span><span data-layout-ignore class="sh" id="f1-sh">firts</span></div>
        <div id="f1-artist"></div>
      </div>
      <script>
        (function () {
          function letters(el, txt) { for (var i = 0; i < txt.length; i++) { var s = document.createElement("span"); s.textContent = txt[i]; el.appendChild(s); } return el.children; }
          var chip = letters(document.getElementById("f1-chiptxt"), "NOW PLAYING");
          var art = letters(document.getElementById("f1-artist"), "tashta x sickboyrostik");
          var tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });

          tl.fromTo("#f1-chip", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.15);
          for (var i = 0; i < chip.length; i++) tl.set(chip[i], { opacity: 1 }, 0.45 + i * 0.07);

          // title assembles out of blur on the intro hits
          tl.set("#f1-title", { opacity: 0 }, 0);
          tl.fromTo("#f1-title", { opacity: 0, scale: 1.12, filter: "blur(40px)" }, { opacity: 0.3, scale: 1.08, filter: "blur(30px)", duration: 0.8, ease: "power2.out" }, 1.579);
          tl.to("#f1-title", { opacity: 0.5, scale: 1.05, filter: "blur(20px)", duration: 0.5, ease: "power2.out" }, 2.67);
          tl.to("#f1-title", { opacity: 0.7, scale: 1.03, filter: "blur(11px)", duration: 0.4, ease: "power2.out" }, 4.133);
          tl.to("#f1-title", { opacity: 0.85, scale: 1.01, filter: "blur(4px)", duration: 0.3, ease: "power2.out" }, 4.574);

          // artist letters type in on the downbeat
          for (var j = 0; j < art.length; j++) tl.fromTo(art[j], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 4.574 + j * 0.035);

          // neon flicker through the perc roll
          for (var k = 0; k < 6; k++) {
            var t0 = 4.923 + k * 0.186;
            tl.set("#f1-m", { opacity: 0.35 }, t0);
            tl.set("#f1-m", { opacity: 1 }, t0 + 0.07);
          }
          tl.to("#f1-title", { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out" }, 6.037);
          // snare: chromatic ghosts flash
          tl.fromTo("#f1-gp", { opacity: 0.9, x: -26 }, { opacity: 0.55, x: -4, duration: 0.2, ease: "power2.out" }, 6.618);
          tl.fromTo("#f1-gc", { opacity: 0.9, x: 26 }, { opacity: 0.55, x: 4, duration: 0.2, ease: "power2.out" }, 6.618);
          tl.to("#f1-chip", { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, 6.4);

          tl.fromTo("#f1-title", { rotationY: -14, rotationX: 6, transformPerspective: 1000 }, { rotationY: 6, rotationX: -2, duration: 6.827, ease: "sine.inOut" }, 0);
          tl.fromTo("#f1-sh", { backgroundPosition: "160% 0" }, { backgroundPosition: "-60% 0", duration: 0.9, ease: "power2.inOut" }, 6.1);
          window.__timelines["01-f1"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
